name: Bootstrap Levus M1

on:
  push:
    branches:
      - build/m1-continuity-runtime
    paths:
      - ".bootstrap/parts/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: build/m1-continuity-runtime
          fetch-depth: 0

      - name: Verify staged archive parts
        shell: bash
        run: |
          set -euo pipefail
          echo "7995f5faadcba88f0f20c78ed0e55e5b64c7ce00cc3c21c629e408d1d8382051  .bootstrap/parts/00" | sha256sum -c -
          echo "09590f5db788d609c97d090e23a99bf26b2094238d364852455b94d227e3b63a  .bootstrap/parts/01" | sha256sum -c -
          echo "82298ae5df632cda4756755429fce99255037010d6f560114b15c35137830ae9  .bootstrap/parts/02" | sha256sum -c -
          echo "75ea1d4fe9bec078c738ce96b5eb8ae47a571b4deb3c6a763b7e999eb60d0052  .bootstrap/parts/03" | sha256sum -c -
          echo "fbfca9cdb606498e304e3a5f68f7fc074c02cba42398be274031e34d9aca89ea  .bootstrap/parts/04" | sha256sum -c -
          echo "3392c5aed223888ef6259541692cd4d91587d21b7fd4a64374326827d99d074d  .bootstrap/parts/05" | sha256sum -c -

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/parts/00 .bootstrap/parts/01 .bootstrap/parts/02 .bootstrap/parts/03 .bootstrap/parts/04 .bootstrap/parts/05 > /tmp/levus_repo.tar.gz.b64
          base64 --decode /tmp/levus_repo.tar.gz.b64 > /tmp/levus_repo.tar.gz
          echo "dab497629d91bba0cc79380530bf887161eefbd727d9bad16dec23832b8f4f9f  /tmp/levus_repo.tar.gz" | sha256sum -c -
          tar -tzf /tmp/levus_repo.tar.gz > /tmp/archive-files.txt
          test -s /tmp/archive-files.txt

      - name: Materialize repository source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/levus_repo.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialization changes to commit."
            exit 0
          fi
          git commit -m "feat: build deterministic continuity runtime"
          git push origin HEAD:build/m1-continuity-runtime

# trigger after workflow registration
