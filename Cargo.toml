[package]
name = "levus"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Autonomous workforce continuity control plane"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.18", features = ["serde", "v4", "v5"] }

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
